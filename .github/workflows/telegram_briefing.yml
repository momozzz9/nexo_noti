# =============================================================================
# GitHub Actions - Telegram 정기 브리핑 자동 실행
# =============================================================================
# 지정된 시간에 정기 실행 (KST 기준):
#   매일 06:00 ~ 23:00까지 2시간 단위 (06:00, 08:00, ..., 22:00 KST) 발송
#   (KST - 9시간 계산하여 UTC 스케줄링 수행)
#   
#   KST 06:00 = UTC 21:00 (전날)
#   KST 08:00 = UTC 23:00 (전날)
#   KST 10:00 = UTC 01:00
#   KST 12:00 = UTC 03:00
#   KST 14:00 = UTC 05:00
#   KST 16:00 = UTC 07:00
#   KST 18:00 = UTC 09:00
#   KST 20:00 = UTC 11:00
#   KST 22:00 = UTC 13:00
#
# 필요한 GitHub Secrets (2개만!):
#   - TELEGRAM_BOT_TOKEN   : Telegram 봇 토큰
#   - TELEGRAM_CHAT_ID     : 메시지 수신할 Chat ID
# =============================================================================

name: Telegram 정기 브리핑 (06:00 ~ 22:00 KST, 2시간 단위)

# ---------------------------------------------
# 실행 트리거 설정
# ---------------------------------------------
on:
  # 정기 실행 스케줄 (매일 06:00~22:00 KST, 2시간 간격)
  schedule:
    # KST 06:00 = UTC 21:00 (전날)
    - cron: '0 21 * * *'
    # KST 08:00 = UTC 23:00 (전날)
    - cron: '0 23 * * *'
    # KST 10:00 = UTC 01:00
    - cron: '0 1 * * *'
    # KST 12:00 = UTC 03:00
    - cron: '0 3 * * *'
    # KST 14:00 = UTC 05:00
    - cron: '0 5 * * *'
    # KST 16:00 = UTC 07:00
    - cron: '0 7 * * *'
    # KST 18:00 = UTC 09:00
    - cron: '0 9 * * *'
    # KST 20:00 = UTC 11:00
    - cron: '0 11 * * *'
    # KST 22:00 = UTC 13:00
    - cron: '0 13 * * *'

  # 수동 실행 지원 (필요 시 GitHub Actions 탭에서 직접 실행 가능)
  workflow_dispatch:

# ---------------------------------------------
# 작업(Job) 정의
# ---------------------------------------------
jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dotenv

      - name: 🚀 정기 브리핑 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/"4_AI_test/My Telegram Noti (nexo)"
          python "4_AI_test/My Telegram Noti (nexo)/telegram_nexo_noti.py"

