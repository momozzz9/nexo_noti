# =============================================================================
# GitHub Actions - Telegram 정기 브리핑 자동 실행
# =============================================================================
# 지정된 시간에 정기 실행 (KST 기준):
#   하루 3번 (한국시간 07:00, 16:00, 22:00) 발송 (KST - 9시간 계산하여 UTC 스케줄링)
#   
#   KST 07:00 = UTC 22:00 (전날)
#   KST 16:00 = UTC 07:00
#   KST 22:00 = UTC 13:00
#
# 필요한 GitHub Secrets (2개만!):
#   - TELEGRAM_BOT_TOKEN   : Telegram 봇 토큰
#   - TELEGRAM_CHAT_ID     : 메시지 수신할 Chat ID
# =============================================================================

name: Telegram 정기 브리핑 (07:00, 16:00, 22:00 KST)

# ---------------------------------------------
# 실행 트리거 설정
# ---------------------------------------------
on:
  # 정기 실행 스케줄 (하루 3번: 07:00, 16:00, 22:00 KST)
  schedule:
    # 07:00 KST = 22:00 UTC (전날)
    - cron: '0 22 * * *'
    # 16:00 KST = 07:00 UTC
    - cron: '0 7 * * *'
    # 22:00 KST = 13:00 UTC
    - cron: '0 13 * * *'

  # 수동 실행 지원 (필요 시 GitHub Actions 탭에서 직접 실행 가능)
  workflow_dispatch:

# ---------------------------------------------
# 작업(Job) 정의
# ---------------------------------------------
jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser python-dotenv

      - name: 🚀 정기 브리핑 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/"4_AI_test/My Telegram Noti (nexo)"
          python "4_AI_test/My Telegram Noti (nexo)/telegram_nexo_noti.py"

